version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:18-slim
    container_name: territorial-oracle-db
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: oracle123
      ORACLE_DATABASE: ORCL
      APP_USER: territorial_dev
      APP_USER_PASSWORD: dev123
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ../../src/main/resources/db/scripts/init-oracle.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../../src/main/resources/db/scripts/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    networks:
      - territorial-network

  ms-territorial:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ms-territorial-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SID: ORCL
      DB_USER: territorial_dev
      DB_PASSWORD: dev123
      JWT_SECRET: territorial-jwt-secret-key-2024-muy-larga-y-segura
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - territorial-network
    restart: unless-stopped

volumes:
  oracle_data:
    driver: local

networks:
  territorial-network:
    driver: bridge
