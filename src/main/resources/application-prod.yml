# ============================================================
# Configuración de PRODUCCIÓN — ms-territorial
# Activar con: -Dspring.profiles.active=prod
# Variables de entorno OBLIGATORIAS:
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, SERVER_PORT
# ============================================================

spring:
  datasource:
    url:      ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.Oracle10gDialect

  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8082}
  compression:
    enabled: true
    mime-types: application/json
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRACION:86400000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    territorial: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
